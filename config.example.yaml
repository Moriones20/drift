# Drift — Configuration
# Copy this file to config.yaml and fill in your credentials

broker:
  server: "ICMarketsSC-MT5-Demo"  # Verify exact name in MT5 → File → Open an Account
  login: 12345678                  # Your MT5 account number
  password: "your_password_here"

strategy:
  timeframe_trend: "D1"
  timeframe_entry: "H4"
  # Bollinger Bands (H4 entry signal)
  bb_period: 20
  bb_std_dev: 2.0
  # RSI thresholds for mean reversion
  rsi_oversold: 30.0
  rsi_overbought: 70.0
  # ADX regime filter: trade ONLY when ADX < adx_max_threshold (ranging market)
  adx_period: 14
  adx_max_threshold: 25.0
  # ATR/RSI periods
  atr_period: 14
  rsi_period: 14
  # Time-stop: close trade if open longer than this many hours
  max_trade_duration_hours: 120
  # MLP regime filter (replaces simple ADX < threshold filter)
  mlp_model_path: "data/regime_model.pkl"  # path to trained model; falls back to ADX if missing
  mlp_lookforward: 20                       # bars to look forward for efficiency-ratio labeling
  mlp_threshold: 0.4                        # efficiency ratio threshold (below = ranging)

risk:
  percent_per_trade: 1.0           # % of current balance risked per trade
  max_open_trades: 4               # Maximum simultaneous trades
  max_same_currency_direction: 2   # Max trades in same direction for one currency
  max_drawdown_percent: 10.0       # Pause bot if drawdown exceeds this %
  stop_loss_atr_multiplier: 2.0    # Wider SL for counter-trend mean reversion
  trailing_stop_atr_multiplier: 1.5
  use_trailing_stop: false         # Mean reversion: no trailing stop (price targets middle BB)
  take_profit_mode: "middle_bb"    # TP at middle Bollinger Band (the mean we revert to)

pairs:
  - AUDCAD                         # Commodity cross — naturally ranges
  - NZDCAD
  - AUDNZD
  - EURCHF                         # Historically range-bound
  - EURGBP

telegram:
  bot_token: "your_bot_token_here"   # Get from @BotFather
  chat_id: "your_chat_id_here"       # Your personal chat ID

reports:
  timezone: "UTC-5"
  weekly_report_day: "sunday"
  weekly_report_hour: 20             # 8pm UTC-5

system:
  loop_check_interval_seconds: 30    # How often to check trailing stops and health
  mt5_reconnect_interval_seconds: 300  # 5 minutes between reconnection attempts
  magic_number: 234000               # Identifies Drift orders in MT5
  friday_close_hour_utc: 20          # Close losing trades at 8pm UTC Friday (3pm UTC-5)
